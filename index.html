<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🦈 サメ算数ゲーム</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#07365e;color:white;text-align:center}button,select{font:inherit;border:0;border-radius:13px;padding:12px;margin:5px;cursor:pointer}button{background:#ffda64;color:#17334c;font-weight:bold}button:active{transform:scale(.97)}#home{padding:20px;max-width:650px;margin:auto}h1{font-size:clamp(28px,7vw,44px)}.panel{background:#ffffff18;border-radius:18px;padding:12px;margin:12px 0}select{max-width:95%;background:white}#play{display:none;position:relative;height:100dvh;overflow:hidden;background:linear-gradient(#47c7e5,#07629a 55%,#022c55)}#hud{position:absolute;top:env(safe-area-inset-top);width:100%;z-index:4;display:flex;justify-content:space-around;align-items:center;background:#002b4caa;padding:8px;font-size:18px}#question{position:absolute;top:13%;left:0;width:100%;font-size:clamp(35px,10vw,62px);font-weight:900;text-shadow:2px 3px 5px #003}#field{position:absolute;inset:28% 0 10%;touch-action:none}#targets{position:absolute;inset:0}.enemy{position:absolute;display:grid;place-items:center;width:78px;height:78px;border-radius:50%;font-size:25px;font-weight:900;background:#f4faff;color:#102c49;border:5px solid #55bde5;box-shadow:0 7px 0 #002b4c77;transform:translate(-50%,-50%);touch-action:none}.enemy.magic{background:#f6c5ff;border-color:#ae74ec}#hero{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font-size:65px;pointer-events:none}#message{position:absolute;top:42%;width:100%;font-size:26px;font-weight:900;text-shadow:1px 2px 4px #003;pointer-events:none}#clockface{display:none;position:absolute;top:15%;left:50%;transform:translateX(-50%);width:175px;height:175px;background:white;border:7px solid #123b63;border-radius:50%;color:#123b63}#clockface span{position:absolute;transform:translate(-50%,-50%);font-weight:bold}.hand{position:absolute;left:50%;bottom:50%;width:6px;background:#123b63;transform-origin:bottom;border-radius:5px}#hourhand{height:46px}#minutehand{height:65px;background:#f1842b}#read{display:none;background:#fff;color:#172b3d;min-height:100dvh;padding:30px 15px}#read h1{font-size:28px}#readMath{font-size:clamp(42px,10vw,65px);margin-top:35px}#readKana{font-size:clamp(32px,9vw,54px);margin:25px}#mascot{font-size:100px;animation:bob 1.4s infinite alternate}@keyframes bob{to{transform:translateY(-12px)}}#result{display:none;position:absolute;inset:0;background:#06365a;z-index:10;padding:15vh 20px}#result h1{font-size:35px}</style>
<div id="home"><h1>🦈 サメ算数ゲーム</h1><p>すうじを ねらって せいかいしよう！</p><div class="panel"><h2>キャラクター</h2><label><input type="radio" name="theme" value="shark" checked> 🦈 サメ</label>　<label><input type="radio" name="theme" value="magic"> 🧙‍♀️ まほう</label></div><div class="panel"><h2>あそびかた</h2><label><input type="radio" name="mode" value="run" checked> れんぞく</label>　<label><input type="radio" name="mode" value="clock"> とけい</label><p id="levelWrap">レベル <select id="level"></select></p><p>はやさ <select id="speed"><option value=".6">🐢 ゆっくり</option><option value="1" selected>🐬 ふつう</option><option value="1.4">⚡ はやい</option></select></p><label><input id="sound" type="checkbox" checked> 🔊 おとを だす</label></div><button id="start" style="font-size:25px;width:85%;padding:20px">▶ スタート！</button><p>サメやモンスターの すうじを タップしてね！</p></div>
<div id="play"><div id="hud"><span id="hearts">♥♥♥♥♥</span><span id="count">1 / 50</span><button id="pause">⏸</button></div><div id="question"></div><div id="clockface"><div id="hourhand" class="hand"></div><div id="minutehand" class="hand"></div></div><div id="field"><div id="targets"></div></div><div id="message"></div><div id="hero">🚤</div><div id="result"><h1 id="resultTitle"></h1><p id="resultText"></p><button id="again">もういちど</button><button id="back">タイトルへ</button></div></div>
<div id="read"><h1 id="readDan"></h1><div id="mascot">🌼</div><div id="readMath"></div><div id="readKana"></div><p id="readNote">こえに だしてね！</p><p id="readCount"></p><button id="stopRead">おわる</button></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),desc=['1けたの たしざん・ひきざん','20まで ± 1けた','20まで 2けたの たしざん','20まで 2けたの ひきざん','20まで たしひき','99まで ± 1けた','99まで ± 2けた',...Array.from({length:8},(_,i)=>(i+2)+'のだん'),'2〜9のだん','3つの かず','九九を いっしょに よもう'];desc.forEach((d,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent='Lv.'+(i+1)+' '+d;$('level').append(o)});document.querySelectorAll('[name=mode]').forEach(e=>e.onchange=()=>$('levelWrap').style.display=e.value==='clock'&&e.checked?'none':'block');let theme='shark',mode='run',lv=1,spd=1,life=5,idx=0,score=0,ans=0,stage=0,active=false,interval=null,timers=[],readIndex=0;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,choose=a=>a[rand(0,a.length-1)],schedule=(f,t)=>{let id=setTimeout(f,t);timers.push(id)},clear=()=>{clearInterval(interval);timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}};function say(s){if(!$('sound').checked)return;try{let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}const kana=['','いち','に','さん','し','ご','ろく','しち','はち','く'];function ku(a,b){let p={2:['にいちが','ににんが','にさんが','にしが','にご','にろく','にしち','にはち','にく'],3:['さんいちが','さざんが','さんしが','さんし','さんご','さぶろく','さんしち','さんぱ','さんく'],4:['しいちが','しにが','しさん','しし','しご','しろく','ししち','しは','しく'],5:['ごいちが','ごに','ごさん','ごし','ごご','ごろく','ごしち','ごは','ごく'],6:['ろくいちが','ろくに','ろくさん','ろくし','ろくご','ろくろく','ろくしち','ろくは','ろっく'],7:['しちいちが','しちに','しちさん','しちし','しちご','しちろく','しちしち','しちは','しちく'],8:['はちいちが','はちに','はっさん','はっし','はちご','はちろく','はちしち','はっぱ','はっく'],9:['くいちが','くに','くさん','くし','くご','くろく','くしち','くは','くく']}[a][b-1];return p}function answerRead(n){return({4:'し',7:'しち',9:'く',14:'じゅうし',17:'じゅうしち',20:'にじゅう',40:'しじゅう',49:'しじゅうく',80:'はちじゅう'})[n]||String(n)}function math(){let a,b,op,kuPair=null;if(lv>=8&&lv<=16){a=lv===16?rand(2,9):lv-6;b=rand(1,9);kuPair=[a,b];return {text:a+' × '+b,answer:a*b,kuPair}}if(lv===17){let x=rand(1,9),y=rand(1,9),z=rand(1,9),o1=rand(0,1)?1:-1,o2=rand(0,1)?1:-1;if(x+o1*y<0)o1=1;if(x+o1*y+o2*z<0)o2=1;return{text:x+(o1===1?' + ':' − ')+y+(o2===1?' + ':' − ')+z,answer:x+o1*y+o2*z}}let max=lv<=5?20:99;a=rand(lv===1?1:10,max);b=rand(1,lv===1?9:([2,6].includes(lv)?9:lv<=5?20:99));op=lv===3?1:lv===4?-1:rand(0,1)?1:-1;if(op===-1&&a<b)[a,b]=[b,a];return{text:a+(op===1?' + ':' − ')+b,answer:a+op*b}}function options(n,suffix=''){let vals=[n],tries=0;while(vals.length<4&&tries++<100){let v=Math.max(0,n+rand(-12,12));if(!vals.includes(v))vals.push(v)}return vals.sort(()=>Math.random()-.5).map(v=>({label:v+suffix,value:v}))}function clock(){let h=rand(1,12),m=rand(0,11)*5;let face=$('clockface');face.style.display='block';face.querySelectorAll('span').forEach(x=>x.remove());for(let i=1;i<=12;i++){let s=document.createElement('span'),a=i*Math.PI/6;s.textContent=i;s.style.left=(50+40*Math.sin(a))+'%';s.style.top=(50-40*Math.cos(a))+'%';face.append(s)}$('hourhand').style.transform='translateX(-50%) rotate('+(h%12*30+m*.5)+'deg)';$('minutehand').style.transform='translateX(-50%) rotate('+(m*6)+'deg)';return {h,m}}let current=null;function drawTargets(items){let area=$('targets');area.replaceChildren();let width=area.clientWidth||innerWidth;items.forEach((o,i)=>{let b=document.createElement('button');b.className='enemy '+(theme==='magic'?'magic':'');b.textContent=(theme==='magic'?'👾 ':'🦈 ')+o.label;b.style.left=(12+(i%2)*76)+'%';b.style.top=(14+Math.floor(i/2)*32)+'%';b.onclick=()=>hit(o.value);area.append(b)});let y=0;clearInterval(interval);interval=setInterval(()=>{if(!active)return;y+=.13*spd;area.style.transform='translateY('+y+'%)';if(y>110){clearInterval(interval);miss()}},50)}function next(){if(!active)return;if(life<=0||idx>=(mode==='clock'?20:50)){finish();return}if(mode==='clock'){if(stage===0)current=clock();$('question').textContent=stage===0?'なんじ？':'なんぷん？';ans=stage===0?current.h:current.m;let values=options(ans,stage===0?'じ':'ふん');drawTargets(values)}else{$('clockface').style.display='none';current=math();ans=current.answer;$('question').textContent=current.text;drawTargets(options(ans));if(current.kuPair)say(ku(...current.kuPair))}$('count').textContent=(idx+1)+' / '+(mode==='clock'?20:50);$('hearts').textContent='♥'.repeat(life)+'♡'.repeat(5-life)}function message(t){$('message').textContent=t;schedule(()=>$('message').textContent='',900)}function hit(v){if(!active)return;clearInterval(interval);if(v===ans){score++;message('✨ せいかい！');if(current&&current.kuPair)say(answerRead(ans));else if(theme==='magic')say('やった！');if(mode==='clock'&&stage===0){stage=1;schedule(next,750)}else{stage=0;idx++;schedule(next,850)}}else{life--;message('こたえは '+ans+'！');if(theme==='shark')say('いてっ！');stage=0;idx++;schedule(next,1250)}}function miss(){if(!active)return;life--;message('こたえは '+ans+'！');stage=0;idx++;schedule(next,1200)}function finish(){active=false;clear();$('result').style.display='block';$('resultTitle').textContent=life?'🎉 よく がんばった！':'やられた〜';$('resultText').textContent='せいかい '+score+'　/　'+(mode==='clock'?20:50)+'　レベル '+lv;say(life?'よくがんばったね':'やられたー')}function start(){clear();theme=document.querySelector('[name=theme]:checked').value;mode=document.querySelector('[name=mode]:checked').value;lv=Number($('level').value);spd=Number($('speed').value);life=5;idx=0;score=0;stage=0;$('home').style.display='none';$('result').style.display='none';if(mode==='run'&&lv===18){$('read').style.display='block';$('play').style.display='none';readIndex=0;readNext();return}$('read').style.display='none';$('play').style.display='block';$('hero').textContent=theme==='shark'?'🚤':'🧙‍♀️';active=true;next()}function home(){active=false;clear();$('home').style.display='block';$('play').style.display='none';$('read').style.display='none'}function readNext(){if($('read').style.display==='none')return;if(readIndex>=72){$('readMath').textContent='🎉 おわり！';$('readKana').textContent='よく がんばったね！';return}let a=2+Math.floor(readIndex/9),b=1+readIndex%9;$('readDan').textContent=a+'のだん';$('readMath').textContent=a+' × '+b+' = '+a*b;$('readKana').textContent=ku(a,b)+answerRead(a*b);$('readCount').textContent=(readIndex+1)+' / 72';if(b===1)say('てびょうし、よろしく。'+a+'のだん、いくよ');schedule(()=>{say(ku(a,b)+answerRead(a*b));schedule(()=>{readIndex++;readNext()},4600)},1800)}$('start').onclick=start;$('again').onclick=start;$('back').onclick=home;$('stopRead').onclick=home;$('pause').onclick=()=>{if(confirm('タイトルに もどる？'))home()};})();
</script></html>
